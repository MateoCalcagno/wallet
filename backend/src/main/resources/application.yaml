spring:
  application:
    name: wallet

  datasource:
    url: jdbc:postgresql://localhost:5432/wallet-db?currentSchema=public&stringtype=unspecified&reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
            time_zone: UTC
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}