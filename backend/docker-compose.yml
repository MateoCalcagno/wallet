version: '3.8'

services:
  db:
    image: postgres:16
    container_name: wallet-db
    restart: always
    environment:
      POSTGRES_DB: wallet-db
      POSTGRES_USER: mateo
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - wallet_data:/var/lib/postgresql/data

volumes:
  wallet_data: